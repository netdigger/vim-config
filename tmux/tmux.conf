# Changing Ctrl+b to Ctrl+j
unbind C-b
set -g prefix C-j
bind-key C-j send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set-option -g default-command bash
set-option -g status-keys vi
set-option -g base-index 1
set-option -g history-limit 100000

# ── Status bar (tmux-powerline) ──
set-environment -g TMUX_POWERLINE_THEME "dark"
set-option -g status-style bg=colour233,fg=colour250
set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g status-left-length 80
set-option -g status-right-length 100
set-option -g status-left "#(bash $HOME/.tmux/powerline/powerline.sh left)"
set-option -g status-right "#(bash $HOME/.tmux/powerline/powerline.sh right)"
setw -g window-status-current-format "#(bash $HOME/.tmux/powerline/powerline.sh window-current-format)"
setw -g window-status-format "#(bash $HOME/.tmux/powerline/powerline.sh window-format)"

# Set compy mode
setw -g mode-keys vi

# Set copy and cancel in copy-mode-vi
bind-key -T copy-mode-vi s send-keys -X begin-selection
bind-key -T copy-mode-vi c send-keys -X copy-selection-and-cancel

# Quick exit
bind-key Q confirm-before -p "Kill tmux server? (y/n)" kill-server

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Refresh tmux configure file
bind-key C-r source-file ~/.tmux.conf \; display 'Reloaded tmux config.'

# Synchorinize panes input
bind-key e setw synchronize-panes on
bind-key E setw synchronize-panes off
